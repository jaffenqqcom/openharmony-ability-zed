[package]
name = "openharmony-ability-plugin-filelaunch"
version = "1.0.0-beta.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "External file-launch (file association) bridge plugin for openharmony-ability"

[dependencies]
# Explicit path/version deps instead of `workspace = true`: this crate is consumed by the host application
# workspace (which does not define the openharmony-ability workspace dependencies), so workspace
# inheritance cannot resolve here.
openharmony-ability = { path = "../ability" }
log = "0.4"
napi-ohos = { version = "1.2", features = ["napi8"] }
napi-derive-ohos = "1.2"
